<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="../../manifest.webmanifest"><title>Lists & Checklists · PRO Ecosystem</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#152238;--line:#344761;--text:#edf4ff;--muted:#aabbd1;--accent:#67e8d2;--warn:#f7c66b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182a43,var(--bg) 65%);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}main{max-width:1250px;margin:auto;padding:20px}header{display:flex;gap:15px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px}h1{font-size:clamp(25px,4vw,38px);margin:4px 0}h2{font-size:19px;margin:0 0 12px}p{color:var(--muted)}a{color:var(--accent)}.tag{color:var(--accent);font-size:12px;letter-spacing:.12em}.layout{display:grid;grid-template-columns:minmax(280px, .9fr) minmax(320px,1.1fr);gap:16px}.panel{background:#111d30;border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;background:#0a1423;color:var(--text);border:1px solid #405671;border-radius:9px}.field.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button,.btn{border:1px solid #54718d;background:#213650;color:white;padding:10px 13px;border-radius:10px;cursor:pointer;text-decoration:none}button.primary{background:#176b68;border-color:#3bd5bd}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.kpi{padding:13px;background:#1b2d44;border-radius:12px;border:1px solid #344c68}.kpi small{display:block;color:var(--muted)}.kpi strong{display:block;font-size:21px;margin-top:4px;overflow-wrap:anywhere}.notice{background:#322b1c;border:1px solid #79613a;padding:12px;border-radius:10px;color:#ffe1a1;margin-top:12px}.muted{color:var(--muted);font-size:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid #344761;white-space:nowrap}svg{width:100%;height:auto;background:#0a1525;border-radius:12px;margin-top:12px}.hide{display:none}@media(max-width:780px){main{padding:12px}.layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}}
</style><link rel="stylesheet" href="../../assets/ecosystem-unified.css"><link rel="stylesheet" href="../../assets/ecosystem-84.css"><script defer src="../../assets/ecosystem-84.js"></script><link rel="stylesheet" href="../../assets/ecosystem-85.css"><link rel="stylesheet" href="../../assets/ecosystem-86.css"><script defer src="../../assets/ecosystem-86.js"></script></head><body><aside class="pro90-links" style="padding:12px;text-align:center;background:#10243a;color:#eafaff"><a href="../projects/index.html">🏗️ Проекты</a> · <a href="../cutting/index.html">📐 Раскрой</a> · <a href="../analytics/index.html">📊 Аналитика</a></aside><main><header><div><div class="tag">PRO ECOSYSTEM · НОВЫЙ МОДУЛЬ</div><h1>Lists & Checklists</h1><p>Списки покупок, инструмента и задач для стройки и повседневной жизни</p></div><a href="../../index.html">← На главную</a></header><div class="layout"><section class="panel"><h2>Новый список</h2><div class="fields"><div class="field wide"><label>Название списка</label><input id="title" value="Покупки для дома"></div><div class="field wide"><label>Пункт</label><input id="item" placeholder="Например: саморезы 4×50"></div><div class="field"><label>Количество / заметка</label><input id="qty" value="1"></div><div class="field"><label>Категория</label><select id="category"><option>Стройка</option><option>Продукты</option><option>Дом</option><option>Авто</option><option>Инструменты</option><option>Другое</option></select></div></div><div class="actions"><button class="primary" id="add">Добавить пункт</button><button id="export">Экспорт JSON</button><button id="clear">Очистить список</button></div></section><section class="panel"><h2 id="heading">Покупки для дома</h2><div id="kpis" class="kpis"></div><div id="list"></div><p class="muted">Список хранится локально в памяти вкладки. Для постоянного хранения используйте экспорт JSON.</p></section></div></main><script>(()=>{const $=id=>document.getElementById(id);let items=[];function draw(){ $('heading').textContent=$('title').value;let done=items.filter(x=>x.done).length;$('kpis').innerHTML=[['Всего пунктов',items.length],['Выполнено',done],['Осталось',items.length-done]].map(x=>'<div class="kpi"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');$('list').innerHTML=items.map((x,i)=>'<div style="display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #344761"><input type="checkbox" data-i="'+i+'" '+(x.done?'checked':'')+' style="width:20px;height:20px"><div style="flex:1"><b style="'+(x.done?'text-decoration:line-through;opacity:.6':'')+'">'+x.text+'</b><div class="muted">'+x.qty+' · '+x.cat+'</div></div><button data-del="'+i+'">Удалить</button></div>').join('');$('list').querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>{items[+e.dataset.i].done=e.checked;draw()});$('list').querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{items.splice(+e.dataset.del,1);draw()})}$('add').onclick=()=>{let text=$('item').value.trim();if(!text)return;items.push({text,qty:$('qty').value,cat:$('category').value,done:false});$('item').value='';draw()};$('title').oninput=draw;$('clear').onclick=()=>{if(confirm('Очистить весь список?')){items=[];draw()}};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({title:$('title').value,items},null,2)],{type:'application/json'}));a.download='checklist.json';a.click();URL.revokeObjectURL(a.href)};draw()})();</script></body></html>
